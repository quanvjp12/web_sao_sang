<!DOCTYPE html>
<html lang="vi">
<head>

  <meta charset="UTF-8">

  <title>Đăng nhập</title>

  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

  <script>
    // == CẤU HÌNH SERVER == Chỉ sửa NGROK_URL mỗi lần restart ngrok
    const NGROK_URL = "https://ransack-shape-upstroke.ngrok-free.dev"; // ← đổi ở đây
    const API       = NGROK_URL;

    const _fetch = window.fetch;
    window.fetch = (url, opts = {}) => {
      if (typeof url === "string" && url.startsWith(NGROK_URL)) {
        opts.headers = { "ngrok-skip-browser-warning": "true", ...opts.headers };
      }
      return _fetch(url, opts);
    };
  </script>

  <style>
    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex; justify-content: center; align-items: center;
      padding: 20px;
      font-family: system-ui, -apple-system, sans-serif;
      position: relative;
    }

    /* ── Ảnh nền mờ ── */
    body::before {
      content: "";
      position: fixed; inset: 0; z-index: 0;
      background-image: url("../picture/truong-dai-hoc.jpg");
      background-size: cover;
      background-position: center;
      filter: blur(3px) brightness(0.45);
      transform: scale(1.05); /* tránh viền trắng khi blur */
    }

    /* overlay màu xanh nhạt phủ lên trên ảnh */
    body::after {
      content: "";
      position: fixed; inset: 0; z-index: 0;
      background: linear-gradient(135deg,
        rgba(17,24,39,0.55),
        rgba(30,58,138,0.55));
    }

    .login-box {
      position: relative; z-index: 1;
      width: 100%; max-width: 400px;
      background: white; padding: 36px 28px;
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .login-logo {
      text-align: center; margin-bottom: 28px;
    }
    .login-logo .icon { font-size: 2.5rem; }
    .login-logo h2 {
      font-size: 1.4rem; font-weight: 800;
      color: #111827; margin: 8px 0 2px;
    }
    .login-logo small { color: #6b7280; font-size: 0.82rem; }
    .form-label { font-weight: 600; font-size: 0.85rem; color: #374151; }
    .form-control {
      border-radius: 10px; padding: 11px 14px;
      border: 1.5px solid #e5e7eb; font-size: 0.95rem;
    }
    .form-control:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
    }
    .btn-login {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, #1e3a8a, #2563eb);
      color: white; border: none; border-radius: 11px;
      font-weight: 700; font-size: 1rem; cursor: pointer;
      margin-top: 8px; transition: opacity 0.2s;
    }
    .btn-login:hover { opacity: 0.9; }
    .btn-login:active { opacity: 0.8; }
    @media (max-width: 480px) {
      .login-box { padding: 28px 20px; }
    }
  </style>

</head>

<body>

  <div class="login-box">
    <div class="login-logo">
      <div class="icon">⭐</div>
      <h2>Trung tâm Sao Sáng</h2>
      <small>Hệ thống quản lý</small>
    </div>
    <div class="mb-3">
      <label class="form-label">Tài khoản</label>
      <input type="text" class="form-control" id="username" placeholder="Nhập tên đăng nhập">
    </div>
    <div class="mb-3">
      <label class="form-label">Mật khẩu</label>
      <input type="password" class="form-control" id="password" placeholder="Nhập mật khẩu">
    </div>
    <button class="btn-login" onclick="login()">Đăng nhập</button>
  </div>

<script>
function login(){
  const data = {
    TenDangNhap:
      document.getElementById("username").value.trim(),
    MatKhau:
      document.getElementById("password").value.trim()
  };
  // kiểm tra rỗng
  if(
    data.TenDangNhap === "" ||
    data.MatKhau === ""
  ){
    alert("Vui lòng nhập đầy đủ thông tin");
    return;
  }
  fetch(`${API}/login`,{
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body: JSON.stringify(data)
  })
  .then(res => res.json())
  .then(data => {
    if(data.success){
      // lưu user
      localStorage.setItem(
        "user",
        JSON.stringify(
            data.user
        )
      );
      // admin
      if(data.user.Role === "admin"){
        window.location.href = "index.html";
      }
      // học viên
      else if(data.user.Role === "hocvien"){
        window.location.href = "hocvien.html";
      }
      // giáo viên
      else if(data.user.Role === "giaovien"){
        window.location.href = "giaovien.html";
      }
    }
    else{
      alert("Sai tài khoản hoặc mật khẩu");
    }
  })
  .catch(err => {
    console.log(err);
    alert("Lỗi server");
  });
}
</script>

</body>
</html>
